<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0d11">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pose</title>
<style>
:root{
  --bg:#0d0d11; --panel:#16161c; --control:#22222b; --hover:#2f2f3b;
  --edge:#2a2a34; --fg:#e4e4ea; --muted:#82828f; --accent:#7aa2ff;
  --sheet: 96px;                      /* collapsed height of the bottom sheet */
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
  overscroll-behavior:none;touch-action:none;user-select:none}
#stage{position:fixed;inset:0;display:block;touch-action:none}

/* ---- floating top bar ---- */
#top{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;
  background:linear-gradient(#0d0d11ee,#0d0d1100);pointer-events:none;z-index:3}
#top > *{pointer-events:auto}
.chip{background:#1c1c24cc;border:1px solid var(--edge);border-radius:999px;
  padding:7px 12px;font-size:13px;color:var(--fg);display:flex;align-items:center;
  gap:8px;backdrop-filter:blur(8px)}
.chip b{font-weight:600}
.icon{width:38px;height:38px;border-radius:12px;background:#1c1c24cc;
  border:1px solid var(--edge);display:grid;place-items:center;font-size:16px;
  backdrop-filter:blur(8px)}
.spacer{flex:1}

/* ---- picture-in-picture second view ---- */
#pip{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 58px);
  width:112px;height:150px;border:1px solid var(--edge);border-radius:12px;
  overflow:hidden;background:#0a0a0e;z-index:2}
#pip canvas{display:block;width:100%;height:100%}
#pip span{position:absolute;left:6px;top:4px;font-size:9px;letter-spacing:.08em;
  color:var(--muted);font-weight:700}
#pip.hidden{display:none}

/* ---- joint readout ---- */
#readout{position:fixed;left:10px;bottom:calc(var(--sheet) + var(--safe-b) + 10px);
  z-index:3;display:none;gap:6px;align-items:center}
#readout.on{display:flex}

/* ---- bottom sheet ---- */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--panel);
  border-top:1px solid var(--edge);border-radius:16px 16px 0 0;
  padding-bottom:var(--safe-b);transform:translateY(0);
  transition:transform .22s cubic-bezier(.2,.8,.2,1);max-height:72vh;
  display:flex;flex-direction:column}
#sheet.open{transform:translateY(0)}
#grip{height:26px;display:grid;place-items:center;flex:0 0 auto}
#grip div{width:38px;height:4px;border-radius:2px;background:#3a3a46}
#tools{display:flex;gap:8px;overflow-x:auto;padding:0 10px 10px;flex:0 0 auto;
  scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;background:var(--control);border:1px solid var(--edge);
  border-radius:12px;padding:9px 13px;font-size:13px;white-space:nowrap}
.tool.on{background:#2b3a63;border-color:var(--accent);color:#dbe6ff}
#panel{overflow-y:auto;padding:0 10px 14px;flex:1 1 auto;display:none}
#sheet.open #panel{display:block}
h4{margin:14px 4px 6px;font-size:10px;letter-spacing:.1em;color:var(--muted);
  text-transform:uppercase;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid.three{grid-template-columns:1fr 1fr 1fr}
button.btn{background:var(--control);border:1px solid var(--edge);color:var(--fg);
  border-radius:11px;padding:11px 8px;font-size:13px;font-family:inherit}
button.btn:active{background:var(--hover)}
select,input{background:var(--control);border:1px solid var(--edge);color:var(--fg);
  border-radius:11px;padding:10px;font-size:13px;font-family:inherit;width:100%}
.row{display:flex;gap:6px;align-items:center;margin:6px 0}
.row label{flex:1;color:var(--muted);font-size:12px}
.row input{width:74px;text-align:center}
#status{padding:6px 6px 0;color:var(--muted);font-size:12px;min-height:18px}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="top">
  <div class="chip" id="person"><b>1</b> / <span id="count">1</span></div>
  <div class="icon" id="prev">‹</div>
  <div class="icon" id="next">›</div>
  <div class="spacer"></div>
  <div class="icon" id="undo">↶</div>
  <div class="icon" id="frame">⛶</div>
</div>

<div id="pip"><span id="pipname">FRONT</span><canvas id="pipcanvas"></canvas></div>

<div id="readout">
  <div class="chip" id="jointinfo">—</div>
  <div class="icon" id="flip">⇄</div>
</div>

<div id="sheet">
  <div id="grip"><div></div></div>
  <div id="tools">
    <div class="tool" id="t-add">＋ Person</div>
    <div class="tool" id="t-sym">Mirror</div>
    <div class="tool" id="t-anchor">Anchor</div>
    <div class="tool" id="t-body">Body</div>
    <div class="tool" id="t-depth">Depth</div>
    <div class="tool" id="t-export">Export</div>
  </div>
  <div id="panel">
    <div id="status">Drag a joint to pose it.</div>
    <h4>Body type</h4>
    <select id="preset"></select>
    <h4>Person</h4>
    <div class="grid">
      <button class="btn" id="b-copy">Duplicate</button>
      <button class="btn" id="b-del">Delete</button>
      <button class="btn" id="b-reset">Reset pose</button>
      <button class="btn" id="b-mirror">Mirror L/R</button>
    </div>
    <h4>Turn figure</h4>
    <div class="grid three">
      <button class="btn" id="b-y-">−Y</button>
      <button class="btn" id="b-x-">−X</button>
      <button class="btn" id="b-z-">−Z</button>
      <button class="btn" id="b-y+">+Y</button>
      <button class="btn" id="b-x+">+X</button>
      <button class="btn" id="b-z+">+Z</button>
    </div>
    <h4>View</h4>
    <div class="grid three">
      <button class="btn" id="v-front">Front</button>
      <button class="btn" id="v-left">Left</button>
      <button class="btn" id="v-top">Top</button>
    </div>
    <h4>Export</h4>
    <div class="row"><label>Output size</label>
      <input id="outw" value="512" inputmode="numeric">
      <input id="outh" value="768" inputmode="numeric"></div>
    <div class="grid">
      <button class="btn" id="b-pose">Pose PNG</button>
      <button class="btn" id="b-depth">Depth PNG</button>
    </div>
  </div>
</div>

<script type="module" src="./app.mjs"></script>
</body>
</html>
